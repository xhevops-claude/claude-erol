<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pie · PI Planning</title>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #0f1117; color: #e9edf5;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #0f1117;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 0.4s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .gl-icon { font-size: 88px; line-height: 1; animation: gl-pop 1.6s ease-in-out infinite; }
    @keyframes gl-pop { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.08) rotate(4deg); } }
    #app-loading .gl-word { font-size: 15px; letter-spacing: 0.42em; text-transform: uppercase;
      color: #f59e0b; font-weight: 700; padding-left: 0.42em; }
    #app-loading .gl-bar {
      position: relative; width: 190px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.10); overflow: hidden;
    }
    #app-loading .gl-bar::after {
      content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; background: #f59e0b; border-radius: 4px;
      animation: gl-bar 1.2s cubic-bezier(0.45,0,0.55,1) infinite;
    }
    @keyframes gl-bar { 0% { left: -40%; } 100% { left: 110%; } }
  </style>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-loading">
    <span class="gl-icon" aria-hidden="true">🥧</span>
    <span class="gl-word">Pie</span>
    <div class="gl-bar" aria-label="Loading"></div>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">🥧</span>
        <div class="brand-text">
          <h1 id="pi-name" spellcheck="false">PI 2026.Q3</h1>
          <span class="sub">PI Planning Board</span>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="board" class="active" type="button">Board</button>
        <button data-tab="risks" type="button">Risks <span class="tab-count" id="risk-count"></span></button>
      </nav>
      <div class="tools">
        <button id="add-team" type="button">+ Team</button>
        <button id="add-sprint" type="button">+ Sprint</button>
        <button id="export-btn" type="button" class="ghost" title="Download JSON">Export</button>
        <button id="import-btn" type="button" class="ghost" title="Load JSON">Import</button>
        <button id="reset-btn" type="button" class="ghost" title="Reset to sample">Reset</button>
        <button id="quit-btn" type="button" class="ghost danger">Quit</button>
      </div>
    </header>

    <section id="view-board" class="view">
      <div class="board-scroll" id="board-scroll">
        <div class="board-content" id="board-content">
          <div class="grid" id="grid"></div>
          <svg id="dep-svg" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
                      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" />
              </marker>
            </defs>
          </svg>
        </div>
      </div>
      <div class="link-hint" id="link-hint" hidden>
        <span>Linking — click a target card</span>
        <button type="button" id="link-cancel">Cancel (Esc)</button>
      </div>
      <div class="legend">
        <span class="lg" data-kind="story"><i></i>Story</span>
        <span class="lg" data-kind="feature"><i></i>Feature</span>
        <span class="lg" data-kind="enabler"><i></i>Enabler</span>
        <span class="lg" data-kind="milestone"><i></i>Milestone</span>
        <span class="lg-sep"></span>
        <span class="lg-tip">Click a card's 🔗 to draw a dependency · drag cards between cells</span>
      </div>
    </section>

    <section id="view-risks" class="view" hidden>
      <div class="risks-wrap">
        <div class="risk-add">
          <input type="text" id="risk-input" placeholder="Describe a risk, then press Enter…" maxlength="160" />
          <button type="button" id="risk-add-btn">Add risk</button>
        </div>
        <div class="roam" id="roam"></div>

        <div class="confidence">
          <h3>Confidence vote <span class="cf-sub">fist of five</span></h3>
          <div class="cf-buttons" id="cf-buttons"></div>
          <div class="cf-result" id="cf-result"></div>
        </div>
      </div>
    </section>

    <input type="file" id="import-file" accept="application/json,.json" hidden />
  </div>

  <script src="app.js"></script>
</body>
</html>
