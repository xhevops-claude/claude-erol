<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Meter · Simulator</title>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #0b1220; color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #172554;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 0.4s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .gl-icon { font-size: 88px; line-height: 1; animation: gl-pop 1.6s ease-in-out infinite; }
    @keyframes gl-pop { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.08) rotate(4deg); } }
    #app-loading .gl-word { font-size: 15px; letter-spacing: 0.42em; text-transform: uppercase;
      color: #93c5fd; font-weight: 700; padding-left: 0.42em; }
    #app-loading .gl-bar {
      position: relative; width: 190px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.12); overflow: hidden;
    }
    #app-loading .gl-bar::after {
      content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; background: #3b82f6; border-radius: 4px;
      animation: gl-bar 1.2s cubic-bezier(0.45,0,0.55,1) infinite;
    }
    @keyframes gl-bar { 0% { left: -40%; } 100% { left: 110%; } }
  </style>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-loading">
    <span class="gl-icon" aria-hidden="true">🅿️</span>
    <span class="gl-word">Parking</span>
    <div class="gl-bar" aria-label="Loading"></div>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🅿️</span>
        <div class="brand-text">
          <h1 class="brand-name">Parking Meter</h1>
          <p class="brand-sub">Bayfront municipal lot</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="stat-active">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-revenue">$0.00</span>
          <span class="stat-label">Revenue</span>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="meter-panel" aria-label="Selected meter">
        <div class="meter-head" id="meter-head">
          <div class="meter-cap">
            <span class="meter-spot" id="meter-spot">SPOT 1</span>
            <span class="meter-lamp" id="meter-lamp" aria-hidden="true"></span>
          </div>
          <div class="meter-window">
            <svg class="dial" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="dial-track" cx="60" cy="60" r="52" />
              <circle class="dial-fill" id="dial-fill" cx="60" cy="60" r="52" />
            </svg>
            <div class="meter-readout">
              <span class="meter-time" id="meter-time">--:--</span>
              <span class="meter-status" id="meter-status">VACANT</span>
            </div>
          </div>
          <div class="meter-tags">
            <span class="meter-plate" id="meter-plate">No vehicle</span>
            <span class="meter-zone" id="meter-zone">—</span>
          </div>
        </div>

        <div class="meter-controls" id="meter-controls"></div>
      </section>

      <aside class="side">
        <section class="spots-panel" aria-label="Parking spots">
          <h2 class="panel-title">Spots</h2>
          <div class="spots-grid" id="spots-grid"></div>
        </section>

        <section class="history-panel" aria-label="Session history">
          <h2 class="panel-title">Recent sessions</h2>
          <ul class="history-list" id="history-list"></ul>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
