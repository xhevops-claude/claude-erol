name: Deploy

# Pushes to `main` deploy to the live URL.
# Pushes to any other branch deploy to /preview/<slug>/<short-sha>/ on
# the same site so you can test the branch on the actual live origin
# before merging. The short-sha route segment makes every deploy's URL
# unique, so a previously visited preview can never be served from the
# browser cache. Before deploying, the branch's older preview folders
# are pruned from gh-pages so previews don't accumulate forever — only
# the newest commit's preview survives per branch.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # peaceiris/actions-gh-pages pushes to gh-pages

# Serialize so concurrent deploys don't fight over the gh-pages branch.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute target directory
        id: target
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "url_path=/" >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
          else
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '/_ ' '-' | tr -cd 'a-zA-Z0-9-' | tr 'A-Z' 'a-z')
            sha="${GITHUB_SHA:0:7}"
            echo "slug=${slug}" >> "$GITHUB_OUTPUT"
            echo "dir=preview/${slug}/${sha}" >> "$GITHUB_OUTPUT"
            echo "url_path=/preview/${slug}/${sha}/" >> "$GITHUB_OUTPUT"
            echo "label=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Prune this branch's old previews
        # Per-commit routes would otherwise pile up one folder per push.
        # Drop the branch's whole /preview/<slug>/ tree from gh-pages
        # before deploying; the deploy step then re-adds only the
        # current commit's folder. Other branches' previews are
        # untouched. Safe against races: the `pages-deploy` concurrency
        # group serializes this job.
        if: steps.target.outputs.label == 'preview'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --quiet --depth 1 --branch gh-pages \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ghp 2>/dev/null; then
            echo "No gh-pages branch yet — nothing to prune."
            exit 0
          fi
          cd /tmp/ghp
          if [ -d "preview/${{ steps.target.outputs.slug }}" ]; then
            git rm -r --quiet "preview/${{ steps.target.outputs.slug }}"
            git -c user.name='github-actions[bot]' \
                -c user.email='github-actions[bot]@users.noreply.github.com' \
                commit --quiet -m "prune(preview): old previews of ${{ steps.target.outputs.slug }}"
            git push --quiet origin gh-pages
          else
            echo "No previous previews for this branch."
          fi

      - name: Cache-bust local assets in deployed HTML
        # GitHub Pages serves `.js`/`.css` with `Cache-Control:
        # max-age=600`, so without a version token Chrome happily
        # serves stale `app.js`/`styles.css` from disk cache for ~10
        # minutes after a deploy even when the user hard-refreshes.
        # Append `?v=<sha>` to relative .js/.css refs in every
        # index.html so each push produces fresh resource URLs.
        # Applies to both production and preview deploys — the asset
        # URLs aren't user-facing, so there's no "stability" to
        # preserve.
        shell: bash
        run: |
          SHA="${GITHUB_SHA:0:7}"
          # Use `#` as the substitution delimiter — `|` would clash
          # with the alternation in `(href|src)` and `(js|css)`. The
          # path character class deliberately excludes `:` and `@`,
          # so absolute URLs (https://unpkg.com/...) won't match.
          while IFS= read -r -d '' f; do
            sed -E -i 's#((href|src)=")([A-Za-z0-9_./-]+\.(js|css))"#\1\3?v='"$SHA"'"#g' "$f"
          done < <(find . -name index.html -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
          exclude_assets: '.github,node_modules,.gitignore,package.json,package-lock.json,.htmlhintrc,.stylelintrc.json,README.md'
          commit_message: 'deploy(${{ steps.target.outputs.label }}): ${{ github.event.head_commit.message || github.ref_name }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Print deploy URL
        run: |
          echo "::notice title=Deployed::https://xhevops-claude.github.io/claude-erol${{ steps.target.outputs.url_path }}"
