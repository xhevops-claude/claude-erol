<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School · Management</title>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #f4f3ee; color: #211f1c;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #1e1b4b;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 0.4s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .gl-icon { font-size: 88px; line-height: 1; animation: gl-pop 1.6s ease-in-out infinite; }
    @keyframes gl-pop { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.08) rotate(4deg); } }
    #app-loading .gl-word { font-size: 15px; letter-spacing: 0.42em; text-transform: uppercase;
      color: #a5b4fc; font-weight: 700; padding-left: 0.42em; }
    #app-loading .gl-bar {
      position: relative; width: 190px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.12); overflow: hidden;
    }
    #app-loading .gl-bar::after {
      content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; background: #6366f1; border-radius: 4px;
      animation: gl-bar 1.2s cubic-bezier(0.45,0,0.55,1) infinite;
    }
    @keyframes gl-bar { 0% { left: -40%; } 100% { left: 110%; } }
  </style>
  <link rel="stylesheet" href="styles.css?v=41f1f4d" />
</head>
<body>
  <div id="app-loading">
    <span class="gl-icon" aria-hidden="true">🏫</span>
    <span class="gl-word">School</span>
    <div class="gl-bar" aria-label="Loading"></div>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🏫</span>
        <div class="brand-text">
          <h1 class="brand-name">Northgate School</h1>
          <p class="brand-sub">Management console</p>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    </header>
    <main class="view" id="view"></main>
  </div>

  <div class="modal" id="modal" hidden></div>

  <script src="app.js?v=41f1f4d"></script>
</body>
</html>
